name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests targeting the main branch
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
          ref: ${{ github.event.pull_request.head.sha || (github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number)) || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: go mod tidy

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y upx

      - name: Build Linux binary
        run: |
          ./Build/buildlinux
          mkdir -p release/linux
          mv curd-linux-x86_64 release/linux/
          mv curd-linux-arm64 release/linux/
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMPRESS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build Android ARM64 binary
        run: |
          ./Build/buildandroid-arm64
          mkdir -p release/android
          mv curd-android-arm64 release/android/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curd-binaries
          path: |
            release/linux/curd-linux-x86_64
            release/linux/curd-linux-arm64
            release/android/curd-android-arm64
          retention-days: 1
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    if: |
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: curd-binaries
          path: downloaded

      - name: Organize Release Files
        run: |
          mkdir -p release_assets
          find downloaded -type f -name "curd-*" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Determine Release Tag and Name
        run: |
          CURD_VERSION=$(cat VERSION.txt 2>/dev/null || echo "1.0.0")
          echo "CURD_VERSION=$CURD_VERSION" >> $GITHUB_ENV
          if echo "${{ github.event.head_commit.message }}" | grep -qiE "release:"; then
            echo "RELEASE_TAG=v$CURD_VERSION" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Curd v$CURD_VERSION" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Curd (Latest Build)" >> $GITHUB_ENV
          fi

      - name: Create or Update Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true 
          files: |
            release_assets/curd-linux-x86_64
            release_assets/curd-linux-arm64
            release_assets/curd-android-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}
